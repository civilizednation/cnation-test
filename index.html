<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemini Q&amp;A 테스트</title>
  <style>
    :root { --bg: #f5f6f8; --card: #fff; --text: #1d1f23; --muted: #6b7280; --accent: #2563eb; --user: #e8efff; --line: #e5e7eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111317; --card: #1b1e24; --text: #e8eaed; --muted: #9aa0a6; --accent: #7aa2ff; --user: #243049; --line: #2c3038; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px; min-height: 100vh; display: flex; flex-direction: column; gap: 16px; }
    h1 { font-size: 1.3rem; margin: 0; }
    #log { flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); white-space: pre-wrap; word-break: break-word; }
    .msg.user { background: var(--user); align-self: flex-end; max-width: 85%; }
    .msg.error { color: #dc2626; }
    .msg.pending { color: var(--muted); }
    .empty { color: var(--muted); text-align: center; margin-top: 40px; }
    form { display: flex; gap: 8px; position: sticky; bottom: 16px; }
    textarea { flex: 1; resize: none; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; min-height: 52px; }
    button { padding: 0 20px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <main>
    <h1>Gemini Q&amp;A 테스트</h1>
    <div id="log"><p class="empty">질문을 입력하고 Enter 를 누르세요. (Shift+Enter 줄바꿈)</p></div>
    <form id="form">
      <textarea id="prompt" maxlength="1000" placeholder="무엇이든 물어보세요" required></textarea>
      <button id="send" type="submit">전송</button>
    </form>
  </main>
  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('prompt');
    const send = document.getElementById('send');

    function addMessage(text, kind) {
      log.querySelector('.empty')?.remove();
      const el = document.createElement('div');
      el.className = `msg ${kind}`;
      el.textContent = text;
      log.appendChild(el);
      el.scrollIntoView({ behavior: 'smooth', block: 'end' });
      return el;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const prompt = input.value.trim();
      if (!prompt) return;

      addMessage(prompt, 'user');
      input.value = '';
      send.disabled = true;
      const answer = addMessage('생각 중…', 'pending');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `요청 실패 (HTTP ${res.status})`);
        answer.textContent = data.reply;
        answer.className = 'msg';
      } catch (error) {
        answer.textContent = `오류: ${error.message}`;
        answer.className = 'msg error';
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
