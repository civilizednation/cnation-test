<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    button {
      padding: 15px 20px;
      margin: 10px;
      font-size: 18px;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      background: #eeeeee;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h2>cnation Firebase 테스트</h2>

  <button onclick="saveData()">데이터 저장</button>
  <button onclick="loadData()">데이터 읽기</button>

  <div id="result">결과 표시</div>

  <script type="module">

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      doc,
      setDoc,
      getDoc
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


    const firebaseConfig = {
  apiKey: "AIzaSyDRx_eMXIfoERYx7ESQtccyumVwEhdEkuU",
  authDomain: "cnation-project-2.firebaseapp.com",
  projectId: "cnation-project-2",
  storageBucket: "cnation-project-2.firebasestorage.app",
  messagingSenderId: "344541318425",
  appId: "1:344541318425:web:b0c4b4bb26d6d93d03c988"
};




    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    window.saveData = async function () {

      const result = document.getElementById("result");

      try {

        await setDoc(
          doc(db, "firebase-test", "test"),
          {
            message: "Firebase 연결 테스트 OK",
            time: new Date().toString()
          }
        );

        result.textContent = "저장 성공";

      } catch (error) {

        result.textContent =
          "저장 실패\n\n" +
          "code: " + error.code + "\n" +
          "message: " + error.message;

        console.error("Firebase write error:", error);
      }
    };


    window.loadData = async function () {

      const result = document.getElementById("result");

      try {

        const snap = await getDoc(
          doc(db, "firebase-test", "test")
        );

        if (snap.exists()) {

          result.textContent =
            "읽기 성공\n\n" +
            JSON.stringify(snap.data(), null, 2);

        } else {

          result.textContent = "읽기 성공\n\n문서가 없습니다.";
        }

      } catch (error) {

        result.textContent =
          "읽기 실패\n\n" +
          "code: " + error.code + "\n" +
          "message: " + error.message;

        console.error("Firebase read error:", error);
      }
    };

  </script>

</body>
</html>
