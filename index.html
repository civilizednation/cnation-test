<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Q&A 웹앱 테스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; padding: 20px; }
    .container { max-width: 680px; margin: 30px auto; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 28px; }
    h1 { font-size: 22px; margin-bottom: 8px; color: #0f172a; }
    p.desc { font-size: 14px; color: #64748b; margin-bottom: 24px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    input[type="password"], textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; transition: border-color 0.2s; }
    input[type="password"]:focus, textarea:focus { border-color: #3b82f6; outline: none; }
    textarea { height: 90px; resize: vertical; }
    button { width: 100%; background: #2563eb; color: #ffffff; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    #outputBox { margin-top: 24px; padding: 16px; border-radius: 8px; background: #f1f5f9; min-height: 80px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .status-badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 4px; margin-bottom: 8px; }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-error { background: #fee2e2; color: #991b1b; }
    .badge-loading { background: #e0f2fe; color: #075985; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gemini Q&A 웹앱 프로토타입</h1>
    <p class="desc">GitHub Pages에 배포하거나 로컬 브라우저에서 바로 질문/답변을 테스트할 수 있는 웹앱입니다.</p>

    <div class="field">
      <label for="apiKey">Gemini API Key (브라우저 메모리에서만 사용되며 서버로 전송되지 않습니다)</label>
      <input type="password" id="apiKey" placeholder="AIzaSy로 시작하는 키를 입력하세요">
    </div>

    <div class="field">
      <label for="prompt">질문 내용</label>
      <textarea id="prompt" placeholder="Gemini에게 질문할 내용을 입력하세요... (예: 인공지능이 우리 삶에 미치는 영향 3줄 요약)"></textarea>
    </div>

    <button id="submitBtn" onclick="askGemini()">질문 보내기</button>

    <div id="outputBox">질문을 입력하고 [질문 보내기]를 누르면 여기에 답변이 표시됩니다.</div>
  </div>

  <script>
    async function askGemini() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const prompt = document.getElementById('prompt').value.trim();
      const outputBox = document.getElementById('outputBox');
      const submitBtn = document.getElementById('submitBtn');

      if (!apiKey) {
        alert('API Key를 입력해주세요.');
        return;
      }
      if (!prompt) {
        alert('질문 내용을 입력해주세요.');
        return;
      }

      submitBtn.disabled = true;
      outputBox.innerHTML = '<span class="status-badge badge-loading">답변 생성 중...</span>\n잠시만 기다려주세요.';

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await res.json();

        if (res.ok) {
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '응답이 비어 있습니다.';
          outputBox.innerHTML = '<span class="status-badge badge-success">성공 (정상 응답)</span>\n' + reply;
        } else {
          outputBox.innerHTML = '<span class="status-badge badge-error">API 오류 (코드: ' + res.status + ')</span>\n' + JSON.stringify(data, null, 2);
        }
      } catch (err) {
        outputBox.innerHTML = '<span class="status-badge badge-error">통신 오류</span>\n' + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
