<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Q&amp;A 테스트</title>
  <style>
    :root { --bg: #f5f6f8; --card: #fff; --text: #1d1f23; --muted: #6b7280; --accent: #2563eb; --user: #e8efff; --line: #e5e7eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111317; --card: #1b1e24; --text: #e8eaed; --muted: #9aa0a6; --accent: #7aa2ff; --user: #243049; --line: #2c3038; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px; min-height: 100vh; display: flex; flex-direction: column; gap: 16px; }
    h1 { font-size: 1.3rem; margin: 0; }
    #log { flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); white-space: pre-wrap; word-break: break-word; }
    .msg.md { white-space: normal; }
    .msg.md > :first-child { margin-top: 0; }
    .msg.md > :last-child { margin-bottom: 0; }
    .msg.md h1, .msg.md h2, .msg.md h3 { font-size: 1.05rem; margin: 1em 0 .4em; }
    .msg.md pre { overflow-x: auto; padding: 10px; border-radius: 8px; background: var(--bg); }
    .msg.md code { font-family: ui-monospace, Menlo, monospace; font-size: .9em; }
    .msg.md blockquote { margin: .5em 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
    .msg.md table { border-collapse: collapse; display: block; overflow-x: auto; }
    .msg.md th, .msg.md td { border: 1px solid var(--line); padding: 4px 8px; }
    .msg.md a { color: var(--accent); }
    .msg.user { background: var(--user); align-self: flex-end; max-width: 85%; }
    .msg.error { color: #dc2626; }
    .msg.pending { color: var(--muted); }
    .sources { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); font-size: .85rem; color: var(--muted); white-space: normal; }
    .sources a { color: var(--accent); text-decoration: none; margin-right: 10px; display: inline-block; }
    .empty { color: var(--muted); text-align: center; margin-top: 40px; }
    form { display: flex; gap: 8px; position: sticky; bottom: 16px; flex-wrap: wrap; }
    .search-toggle { width: 100%; display: flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); background: var(--bg); }
    textarea { flex: 1; resize: none; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; min-height: 52px; }
    button { padding: 0 20px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <main>
    <h1>AI Q&amp;A 테스트</h1>
    <div id="log"><p class="empty">질문을 입력하고 Enter 를 누르세요. (Shift+Enter 줄바꿈)</p></div>
    <form id="form">
      <label class="search-toggle"><input type="checkbox" id="search" /> 🔍 Google 검색 사용 (최신 정보가 필요할 때만, Gemini 전용)</label>
      <textarea id="prompt" maxlength="1000" placeholder="무엇이든 물어보세요" required></textarea>
      <button id="send" type="submit">전송</button>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('prompt');
    const send = document.getElementById('send');
    const search = document.getElementById('search');

    // 마크다운을 HTML 로 바꿔서 표시 (라이브러리를 못 불러오면 일반 텍스트로)
    function renderMarkdown(el, text) {
      if (window.marked && window.DOMPurify) {
        el.innerHTML = DOMPurify.sanitize(marked.parse(text));
        el.querySelectorAll('a').forEach((a) => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
        el.classList.add('md');
      } else {
        el.textContent = text;
      }
    }

    function addMessage(text, kind) {
      log.querySelector('.empty')?.remove();
      const el = document.createElement('div');
      el.className = `msg ${kind}`;
      el.textContent = text;
      log.appendChild(el);
      el.scrollIntoView({ behavior: 'smooth', block: 'end' });
      return el;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const prompt = input.value.trim();
      if (!prompt) return;

      addMessage(prompt, 'user');
      input.value = '';
      send.disabled = true;
      const answer = addMessage('생각 중…', 'pending');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, search: search.checked }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `요청 실패 (HTTP ${res.status})`);
        answer.className = 'msg';
        renderMarkdown(answer, data.reply);
        const meta = document.createElement('div');
        meta.className = 'sources';
        meta.textContent = `${data.provider} · ${data.model}${data.search ? ' · 🔍 검색 사용' : ''}`;
        answer.appendChild(meta);
        if (data.sources?.length) {
          const box = document.createElement('div');
          box.className = 'sources';
          box.append('출처: ');
          data.sources.forEach((source, i) => {
            const link = document.createElement('a');
            link.href = source.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = `[${i + 1}] ${source.title}`;
            box.appendChild(link);
          });
          answer.appendChild(box);
        }
      } catch (error) {
        answer.textContent = `오류: ${error.message}`;
        answer.className = 'msg error';
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
