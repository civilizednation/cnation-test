<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Q&A 웹앱</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; padding: 16px; }
    .container { max-width: 600px; margin: 20px auto; background: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 24px; }
    h1 { font-size: 20px; margin-bottom: 8px; color: #0f172a; }
    p.desc { font-size: 13px; color: #64748b; margin-bottom: 20px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155; }
    input[type="password"], textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
    input[type="password"]:focus, textarea:focus { border-color: #2563eb; outline: none; }
    textarea { height: 90px; resize: vertical; }
    .key-status { font-size: 12px; margin-top: 4px; color: #16a34a; font-weight: 500; }
    button.btn-primary { width: 100%; background: #2563eb; color: #ffffff; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    button.btn-primary:hover { background: #1d4ed8; }
    button.btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    #outputBox { margin-top: 20px; padding: 16px; border-radius: 8px; background: #f1f5f9; min-height: 80px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .status-badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 4px; margin-bottom: 8px; }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-error { background: #fee2e2; color: #991b1b; }
    .badge-loading { background: #e0f2fe; color: #075985; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gemini Q&A 웹앱</h1>
    <p class="desc">질문을 입력하면 Gemini가 답변을 생성해 드립니다.</p>

    <!-- GitHub Actions 빌드 시 주입용 변수 또는 로컬스토리지 자동 기억 -->
    <script>
      // 만약 GitHub Actions 빌드 시 주입된 경우 이 상수에 값이 들어감
      const INJECTED_KEY = "__GEMINI_API_KEY__";
    </script>

    <div class="field" id="keySection">
      <label for="apiKey">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="처음 1회만 키를 입력하면 브라우저에 자동 기억됩니다">
      <div id="keyNotice" class="key-status"></div>
    </div>

    <div class="field">
      <label for="prompt">질문 내용</label>
      <textarea id="prompt" placeholder="질문 내용을 입력하세요..."></textarea>
    </div>

    <button id="submitBtn" class="btn-primary" onclick="askGemini()">질문 보내기</button>

    <div id="outputBox">질문을 입력하고 [질문 보내기]를 누르세요.</div>
  </div>

  <script>
    const keyInput = document.getElementById('apiKey');
    const keyNotice = document.getElementById('keyNotice');
    const keySection = document.getElementById('keySection');

    // 1. 빌드 시 주입된 키가 있는지 확인
    let activeKey = "";
    if (INJECTED_KEY && !INJECTED_KEY.startsWith("__")) {
      activeKey = INJECTED_KEY;
      keySection.style.display = 'none'; // 주입된 경우 입력창 숨김
    } else {
      // 2. 없으면 브라우저 로컬스토리지에서 기존 저장된 키 불러오기
      const saved = localStorage.getItem('GEMINI_API_KEY');
      if (saved) {
        keyInput.value = saved;
        activeKey = saved;
        keyNotice.textContent = "✅ 저장된 키가 자동으로 불러와졌습니다 (다시 입력 불필요).";
      }
    }

    // 키 입력창 변경 시 실시간 자동 저장
    keyInput.addEventListener('input', () => {
      const val = keyInput.value.trim();
      if (val) {
        localStorage.setItem('GEMINI_API_KEY', val);
        activeKey = val;
        keyNotice.textContent = "✅ 브라우저에 키가 안전하게 저장되었습니다.";
      } else {
        localStorage.removeItem('GEMINI_API_KEY');
        activeKey = "";
        keyNotice.textContent = "";
      }
    });

    async function askGemini() {
      const prompt = document.getElementById('prompt').value.trim();
      const outputBox = document.getElementById('outputBox');
      const submitBtn = document.getElementById('submitBtn');

      const apiKey = activeKey || keyInput.value.trim();

      if (!apiKey) {
        alert('API Key를 입력해주세요.');
        keyInput.focus();
        return;
      }
      if (!prompt) {
        alert('질문 내용을 입력해주세요.');
        return;
      }

      submitBtn.disabled = true;
      outputBox.innerHTML = '<span class="status-badge badge-loading">답변 생성 중...</span>\n잠시만 기다려주세요.';

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await res.json();

        if (res.ok) {
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '응답 내용이 없습니다.';
          outputBox.innerHTML = '<span class="status-badge badge-success">답변 완료</span>\n' + reply;
        } else {
          outputBox.innerHTML = '<span class="status-badge badge-error">오류 (코드: ' + res.status + ')</span>\n' + JSON.stringify(data, null, 2);
        }
      } catch (err) {
        outputBox.innerHTML = '<span class="status-badge badge-error">통신 오류</span>\n' + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
