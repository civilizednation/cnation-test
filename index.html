<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Firebase Test</title>
<style>
body {
    font-family: Arial;
    padding: 30px;
}
button {
    padding: 15px;
    margin: 10px;
    font-size: 18px;
}
#result {
    margin-top:20px;
    padding:20px;
    background:#eee;
}
</style>
</head>

<body>

<h2>cnation Firebase 테스트</h2>

<button onclick="saveData()">데이터 저장</button>
<button onclick="loadData()">데이터 읽기</button>

<div id="result">결과 표시</div>


<script type="module">

import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { 
    getFirestore,
    doc,
    setDoc,
    getDoc
} from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyCTwOAC_LrrKH8CKepUOTf0pyd9qRv4y_8",

authDomain: "cnation-project.firebaseapp.com",

projectId: "cnation-project",

storageBucket: "cnation-project.firebasestorage.app",

messagingSenderId: "1004154104261",

appId: "1:1004154104261:web:0eac4c7ded38262ae5c3ac",

measurementId: "G-7PW1NSP5EQ"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

window.db = db;
    
console.log(firebaseConfig.projectId);
console.log(app.options);


window.saveData = async function(){

    try {

        await setDoc(
            doc(db,"firebase-test","test"),
            {
                message:"Firebase 연결 테스트 OK",
                time:new Date().toString()
            }
        );

        document.getElementById("result").innerHTML =
        "저장 성공";

    }
    catch(e){

        document.getElementById("result").innerHTML =
        "저장 실패 : " + e.message;

        console.error(e);
    }

}


window.loadData = async function(){

    try {

        const snap =
        await getDoc(
            doc(db,"firebase-test","test")
        );


        if(snap.exists()){

            document.getElementById("result").innerHTML =
            JSON.stringify(
                snap.data(),
                null,
                2
            );

        }
        else{

            document.getElementById("result").innerHTML =
            "데이터 없음";

        }

    }
    catch(e){

        document.getElementById("result").innerHTML =
        "읽기 실패 : " + e.message;

        console.error(e);

    }

}

</script>

</body>
</html>
