name: AI Key Check

on:
  workflow_dispatch: # Actions 탭에서 "Run workflow" 버튼으로 실행

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 등록된 AI 키 호출 테스트
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # GitHub Secrets 이름은 GITHUB_ 로 시작할 수 없어서 GH_MODELS_TOKEN 으로 저장합니다.
          GITHUB_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/check-key.js
