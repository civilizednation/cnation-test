function scrollSeq(F,t){let s=0;F.forEach((f,i)=>{const nx=F[i+1];s+=flick(f,nx?Math.min(t,nx.t0):t)});return s}

const TAPS=[];ACT.forEach(a=>a.taps&&TAPS.push({pr:a.taps[0][0],x:a.x,y:a.y}));
const R0=24;
function touchAt(t){
  for(const a of ACT){
    if(t<a.ap||t>a.rl+0.55) continue;
    const from=a.from||[a.x+34,a.y+64];
    const g=spring(t-a.ap,12);
    let x=lerp(from[0],a.x,g), y=lerp(from[1],a.y,g);
    if(a.f){ if(a.hx) x-=fingerD(a.f,t); else y-=fingerD(a.f,t); }
    const rings=[];
    let press=0;
    if(a.taps) a.taps.forEach(([p,r],i)=>{press+=spring(t-p,26)-(i<a.taps.length-1?spring(t-r,26):0);if(i<a.taps.length-1&&t>=r)rings.push(easeOut3((t-r)/0.45))});
    else press=spring(t-(a.f.t0-0.06),26);
    if(t<a.rl) return {x,y,disc:spring(t-a.ap,14)*(1-0.22*press),rings};
    rings.push(easeOut3((t-a.rl)/0.5));
    return {x,y,rings};
  }
  return null;
}

// ───────── seek ─────────
function seek(t){
  t=((t%DUR)+DUR)%DUR;
  // 카메라
  let zs=1,tx=0,ty=0;
  for(const a of TAPS){const b=0.045*(spring(t-a.pr,9)-spring(t-a.pr-0.3,9));zs+=b;tx-=b*(SCR.x+a.x*PX);ty-=b*(SCR.y+a.y*PX)}
  $('stage').style.transform=`translate(${tx}px,${ty}px) scale(${zs})`;
  // 홈: 배너가 20초 주기로 천천히 흐름 (처음과 끝이 같음)
  const w=2*Math.PI*t/DUR;
  BIMG.style.transform=`scale(${1.1+0.03*Math.sin(w)}) translate(${9*Math.sin(w+0.5)}px,${4*Math.cos(w)}px)`;
  // 화면 2 스크롤
  const o2=off2(t);
  sc2.style.transform=`translateY(${-o2}px)`; blur(sc2,0,vel(off2,t)*MB);
  // 화면 3 확대·끌기
  const z=zoomS(t), px=panX(t);
  const zx=ZP.x, zy=ZP.y-168;
  SHEETS.style.transform=`translate(${px+zx*(1-z)}px,${zy*(1-z)}px) scale(${z})`;
  blur(SHEETS,vel(panX,t)*MB/z,0);
  // 화면 4 목록
  const m1=spring(t-DD_OPEN), m2=spring(t-DD_CLOSE);
  const pOn=t>=DD_OPEN&&t<DD_CLOSE+0.9;
  showD(PANEL,pOn);
  if(pOn){
    const k=clamp(m1-m2,-0.05,1.05);
    place(PANEL,lerpR(FR,PR,k));
    PITEMS.forEach((it,i)=>{
      const sel=i===SEL;
      it.r.style.background=sel&&t>=12.92&&t<13.0+0.01?'#F1F1F1':'transparent';
      const dy=-(SEL*IH)*m2;
      it.r.style.transform=`translateY(${dy+10*(1-spring(t-DD_OPEN-0.03*i,12))}px)`;
      it.tx.style.color=i===0?'#8E8E8E':'#111';
      
    });
  }
  const chosen=t>=DD_CLOSE;
  showD(FPH,!chosen);showD(FVAL,chosen);
  PH4.style.transform=`translateY(${320*spring(t-13.08,11)}px)`;
  NEW4.style.transform=`translateY(${320*(1-spring(t-13.16,11))}px)`;
  blur(NEW4,0,vel(tt=>320*(1-spring(tt-13.16,11)),t)*MB);
  // 화면 5 스크롤
  const o5=off5(t);
  sc5.style.transform=`translateY(${-o5}px)`; blur(sc5,0,vel(off5,t)*MB);
  // 창
  WINS.forEach(wd=>winFrame(wd,t));
  // 터치 원
  const T=touchAt(t), te=$('touch');
  if(T&&T.disc!=null){
    const r=R0*T.disc;
    te.style.width=te.style.height=2*r+'px';te.style.transform=`translate(${T.x-r}px,${T.y-r}px)`;showD(te,true);
    const a=touchAt(t+DT),b=touchAt(t-DT);
    if(a&&b) blur(te,(a.x-b.x)/(2*DT)*MB,(a.y-b.y)/(2*DT)*MB);
  } else showD(te,false);
  [0,1].forEach(i=>{
    const re=$('ring'+i), e=T&&T.rings[i];
    if(e==null||e>=0.999){showD(re,false);return}
    const r=R0*0.78+R0*1.15*e, bw=Math.max(1.5,R0*0.78*Math.pow(1-e,2.2));
    re.style.width=re.style.height=2*r+'px';re.style.borderWidth=bw+'px';re.style.opacity=(1-e).toFixed(4);
    re.style.transform=`translate(${T.x-r}px,${T.y-r}px)`;showD(re,true);
  });
}

// ───────── 소리 ─────────
window.renderAudio=async function(){
  const SR=48000,ctx=new OfflineAudioContext(2,SR*DUR,SR);
  let seed=12345;const rnd=()=>(seed=(seed*1664525+1013904223)>>>0)/4294967296;
  const nb=ctx.createBuffer(1,SR,SR);{const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1}
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-10;comp.ratio.value=3;comp.connect(ctx.destination);
  const M=ctx.createGain();M.gain.value=0.8;M.connect(comp);
  function kick(t,g){const o=ctx.createOscillator(),a=ctx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(44,t+0.13);a.gain.setValueAtTime(0.0001,t);a.gain.exponentialRampToValueAtTime(0.9*g,t+0.004);a.gain.exponentialRampToValueAtTime(0.0001,t+0.42);o.connect(a);a.connect(M);o.start(t);o.stop(t+0.45)}
  function noise(t,dur,f0,f1,g,q=1){const s=ctx.createBufferSource();s.buffer=nb;const f=ctx.createBiquadFilter();f.type='bandpass';f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);const a=ctx.createGain();a.gain.setValueAtTime(0.0001,t);a.gain.exponentialRampToValueAtTime(g,t+dur*0.35);a.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(a);a.connect(M);s.start(t);s.stop(t+dur+0.02)}
  function tone(t,fr,dur,g,type='sine'){const o=ctx.createOscillator(),a=ctx.createGain();o.type=type;o.frequency.value=fr;a.gain.setValueAtTime(0.0001,t);a.gain.exponentialRampToValueAtTime(g,t+0.005);a.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(a);a.connect(M);o.start(t);o.stop(t+dur+0.02)}
  for(let b=0;b<DUR*2;b++) kick(b*0.5,b%4===0?1:0.7);
  for(const a of ACT) if(a.taps) a.taps.forEach(([p,r])=>{tone(p,2400,0.03,0.07);tone(r,1600,0.05,0.13)});
  for(const tt of [1.0,6.0,11.0,12.0,15.0]) noise(tt,0.45,300,2600,0.3,0.9);
  for(const tt of [10.0,13.0,14.0,18.0]) noise(tt,0.45,2600,300,0.28,0.9);
  for(const f of [...F2,PAN,...F5]) noise(f.t0,0.5,1800,500,0.15,0.7);
  tone(7.5,880,0.14,0.12,'triangle');tone(7.56,1320,0.18,0.1,'triangle');
  const buf=await ctx.startRendering();
  const L=buf.getChannelData(0),R=buf.getChannelData(1),n=L.length,pcm=new Int16Array(n*2);
  for(let i=0;i<n;i++){pcm[2*i]=clamp(L[i],-1,1)*32767;pcm[2*i+1]=clamp(R[i],-1,1)*32767}
  let s='';const u=new Uint8Array(pcm.buffer);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));
  return btoa(s);
};
